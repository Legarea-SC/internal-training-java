<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>トップページ</title>

    <!-- ============================
         Bootstrap（WebJars）読み込み
         ============================ -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>


</head>
<body>

<!-- Bootstrap JS -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

<section layout:fragment="content">

    <div class="container mt-5 text-center">

        <!-- ============================
             タイトル（メイン見出し）
             ============================ -->
        <h1 class="mb-4">LEGAREA社員管理へようこそ</h1>

        <!-- ============================
             メインメニュー（4つのボタン）
             ・一覧
             ・追加
             ・更新
             ・削除
             ============================ -->
        <div class="d-grid gap-3 col-6 mx-auto button-area">

            <!-- 社員一覧ページへ -->
            <a th:href="@{/list}" class="btn btn-primary btn-lg">社員一覧</a>

            <!-- 社員追加ページへ -->
            <a th:href="@{/input}" class="btn btn-success btn-lg">社員追加</a>

            <!-- 社員情報更新ページへ -->
            <a th:href="@{/update}" class="btn btn-info btn-lg">社員情報更新</a>

            <!-- 社員削除ページへ -->
            <a th:href="@{/delete}" class="btn btn-danger btn-lg">社員削除</a>

        </div>
    </div>

</section>

</body>
</html>

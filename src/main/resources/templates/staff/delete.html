<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>社員情報削除</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-4">
        <h1 class="mb-4">社員情報削除</h1>
        <p>削除したい社員を選択してください</p>

        <!-- 社員選択フォーム -->
        <form th:action="@{/delete}" method="get">
            <div class="d-flex gap-2 mb-3">
                <select id="staffId"
                        name="staffId"
                        class="form-select"
                        style="width: 260px;">
                    <option value="">社員を選択してください</option>
                    <option th:each="staff : ${staffList}"
                            th:value="${staff.staffid}"
                            th:text="${staff.staffid + '：' + staff.name}">
                    </option>
                </select>

                <button type="submit" class="btn btn-primary text-nowrap">検索</button>
            </div>
        </form>

        <!-- メッセージ表示 -->
        <div th:if="${successMessage}"
             class="alert alert-success mt-3"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="alert alert-danger mt-3"
             th:text="${errorMessage}">
        </div>

        <p th:if="${staffDetail != null}" class="mt-4 text-danger">
            以下の社員情報を削除します。内容を確認してください。
        </p>

        <!-- 削除対象表示フォーム -->
        <form th:action="@{/delete}" method="post">
            <table class="table table-hover table-bordered mt-3">
                <thead class="table-primary">
                <tr>
                    <th>社員コード</th>
                    <th>名前</th>
                    <th>セイ</th>
                    <th>メイ</th>
                    <th>部署</th>
                    <th>役職</th>
                    <th>年齢</th>
                </tr>
                </thead>

                <tbody>
                <tr>
                    <td>
                        <input type="text"
                               name="staffId"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.staffid : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.name : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.firstName : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.lastName : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.division : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.position : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.age : ''}"
                               readonly>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">削除</button>
                <a th:href="@{/}" class="btn btn-secondary">戻る</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>

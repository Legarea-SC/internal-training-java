<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>社員情報更新</title>
</head>
<body>
<section layout:fragment="content">
    <h1 class="mb-4">社員情報更新</h1>

    <form th:action="@{/update}" method="get" class="row g-3 mb-3">
        <div class="col-auto">
            <label>
                <input type="text" name="staffId" class="form-control" placeholder="社員コードで検索">
            </label>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">検索</button>
        </div>
    </form>

    <div th:if="${message != null}" class="alert alert-warning" role="alert">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/update}" th:object="${staffUpdate}" method="post">
        <table class="table table-hover table-bordered" style="table-layout: fixed; width: 100%;">
            <thead class="table-primary">
            <tr>
                <th>社員コード</th>
                <th>名前</th>
                <th>セイ</th>
                <th>メイ</th>
                <th>部署</th>
                <th>役職</th>
                <th>年齢</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td><input type="text" th:field="*{staffId}" class="form-control" readonly></td>
                <td><input type="text" th:field="*{name}" class="form-control"></td>
                <td><input type="text" th:field="*{firstName}" class="form-control"></td>
                <td><input type="text" th:field="*{lastName}" class="form-control"></td>
                <td><input type="text" th:field="*{division}" class="form-control"></td>
                <td><input type="text" th:field="*{position}" class="form-control"></td>
                <td><input type="number" th:field="*{age}" class="form-control"></td>
            </tr>
            </tbody>
        </table>
        <div class="col-auto">
            <button type="submit" class="btn btn-warning btn-lg">更新</button>
            <a th:href="@{/}" class="btn btn-secondary btn-lg">戻る</a>
        </div>
    </form>

</section>
</body>
</html>

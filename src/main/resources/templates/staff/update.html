<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>社員情報更新</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container mt-4">
        <h1 class="mb-4">社員情報更新</h1>
        <p>更新したい社員コードを入力してください</p>

        <form th:action="@{/update}" method="get">
            <div class="d-flex gap-2 mb-3">
                <input type="text"
                       id="staffId"
                       name="staffId"
                       class="form-control"
                       placeholder="社員コードで検索"
                       style="width: 260px;">
                <button type="submit" class="btn btn-primary text-nowrap">検索</button>
            </div>
        </form>

        <div th:if="${successMessage}"
             class="alert alert-success mt-3"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="alert alert-danger mt-3"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/update}" method="post">
            <table class="table table-hover table-bordered mt-4">
                <thead class="table-primary">
                <tr>
                    <th>社員コード</th>
                    <th>名前</th>
                    <th>セイ</th>
                    <th>メイ</th>
                    <th>部署</th>
                    <th>役職</th>
                    <th>年齢</th>
                </tr>
                </thead>

                <tbody>
                <tr>
                    <td>
                        <input type="text"
                               name="staffId"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.staffid : ''}"
                               readonly>
                    </td>

                    <td>
                        <input type="text"
                               name="name"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.name : ''}">
                    </td>

                    <td>
                        <input type="text"
                               name="firstName"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.firstName : ''}">
                    </td>

                    <td>
                        <input type="text"
                               name="lastName"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.lastName : ''}">
                    </td>

                    <td>
                        <input type="text"
                               name="division"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.division : ''}">
                    </td>

                    <td>
                        <input type="text"
                               name="position"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.position : ''}">
                    </td>

                    <td>
                        <input type="number"
                               name="age"
                               class="form-control"
                               th:value="${staffDetail != null ? staffDetail.age : ''}">
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">更新</button>
                <a th:href="@{/}" class="btn btn-secondary">戻る</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>

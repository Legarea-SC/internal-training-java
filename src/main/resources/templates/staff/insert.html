<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>社員情報追加</title>
</head>
<body>

<section layout:fragment="content">
    <div class="container mt-4">
        <h1 class="mb-4">社員情報追加</h1>
        <p>社員情報を入力して登録してください</p>

        <div th:if="${message}" th:text="${message}" class="text-danger fw-bold fs-5 mb-2" ></div>

        <form th:action="@{/insert}" method="post">
            <div class="mb-3">
            <label for="staffId" class="form-label">社員コード</label>
            <input type="text" id="staffId" name="staffId" class="form-control">
        </div>
            <div class="mb-3">
                <label for="name" class="form-label">氏名</label>
                <input type="text" id="name" name="name" class="form-control">
            </div>
            <div class="mb-3">
                <label for="division" class="form-label">部署</label>
                <input type="text" id="division" name="division" class="form-control">
            </div>
            <div class="mb-3">
                <label for="firstName" class="form-label">セイ</label>
                <input type="text" id="firstName" name="firstName" class="form-control">
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">メイ</label>
                <input type="text" id="lastName" name="lastName" class="form-control">
            </div>
            <div class="mb-3">
                <label for="position" class="form-label">役職</label>
                <input type="text" id="position" name="position" class="form-control">
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">年齢</label>
                <input type="number" id="age" name="age" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">登録</button>
        </form>
    </div>
</section>

</body>
</html>

<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>社員詳細</title>
</head>
<body>
<section layout:fragment="content">

    <!-- ============================
         タイトル
         ============================ -->
    <h1 class="mb-4">社員詳細情報</h1>

    <div>

        <!-- ============================
             社員詳細テーブル
             ・Controller から渡された staffDetail を表示
             ・すべて読み取り専用（表示のみ）
             ============================ -->
        <table class="table table-hover table-bordered">
            <thead class="table-primary">
            <tr>
                <th>社員コード</th>
                <th>名前</th>
                <th>セイ</th>
                <th>メイ</th>
                <th>部署</th>
                <th>役職</th>
                <th>年齢</th>
            </tr>
            </thead>

            <tbody>
            <!-- staffDetail の各プロパティを表示 -->
            <td th:text="${staffDetail.staffId}"></td>
            <td th:text="${staffDetail.name}"></td>
            <td th:text="${staffDetail.firstName}"></td>
            <td th:text="${staffDetail.lastName}"></td>
            <td th:text="${staffDetail.division}"></td>
            <td th:text="${staffDetail.position}"></td>
            <td th:text="${staffDetail.age}"></td>
            </tbody>
        </table>

        <!-- ============================
             戻るボタン
             ・一覧画面（/list）へ戻る
             ============================ -->
        <a th:href="@{/list}"
           class="btn btn-primary btn-lg">戻る</a>

    </div>

</section>
</body>
</html>

<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>社員情報追加</title>
</head>
<body>

<section layout:fragment="content">
    <div class="container mt-4">
        <h1 class="mb-4">社員情報追加</h1>
        <p>社員情報を入力して登録してください</p>

        <div th:if="${message}" th:text="${message}" th:class="${messageClass}"></div>

        <form th:action="@{/input}" method="post">
            <div class="row mb-3 align-items-center">
                <label for="staffId" class="col-sm-2 col-form-label">社員コード</label>
                <div class="col-sm-10">
                    <input type="text" id="staffId" name="staffId" class="form-control" placeholder="例：le001">
                    <div th:if="${staffIdError}" th:text="${staffIdError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="name" class="col-sm-2 col-form-label">氏名</label>
                <div class="col-sm-10">
                    <input type="text" id="name" name="name" class="form-control" placeholder="例：山田太郎">
                    <div th:if="${nameError}" th:text="${nameError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="division" class="col-sm-2 col-form-label">部署</label>
                <div class="col-sm-10">
                    <input type="text" id="division" name="division" class="form-control" placeholder="例：システム開発部">
                    <div th:if="${divisionError}" th:text="${divisionError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="firstName" class="col-sm-2 col-form-label">セイ</label>
                <div class="col-sm-10">
                    <input type="text" id="firstName" name="firstName" class="form-control" placeholder="例：ヤマダ">
                    <div th:if="${firstNameError}" th:text="${firstNameError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="lastName" class="col-sm-2 col-form-label">メイ</label>
                <div class="col-sm-10">
                    <input type="text" id="lastName" name="lastName" class="form-control" placeholder="例：タロウ">
                    <div th:if="${lastNameError}" th:text="${lastNameError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="position" class="col-sm-2 col-form-label">役職</label>
                <div class="col-sm-10">
                    <input type="text" id="position" name="position" class="form-control" placeholder="例：主任">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="age" class="col-sm-2 col-form-label">年齢</label>
                <div class="col-sm-10">
                    <input type="number" id="age" name="age" class="form-control" placeholder="例：25">
                    <div th:if="${ageError}" th:text="${ageError}" class="text-danger fw-bold small"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-success">登録</button>
            <a th:href="@{/}" class="btn btn-secondary ms-2">戻る</a>
        </form>
    </div>
</section>

</body>
</html>

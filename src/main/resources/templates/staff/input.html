<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title>社員情報追加</title>
</head>
<body>
<section layout:fragment="content">
  <h1 class="mb-4">社員情報追加</h1>

  <div class="card p-4" style="background-color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px;">
    <form th:action="@{/input}" th:object="${staffForm}" method="post">

      <p class="text-danger fw-bold" th:if="${errorMessage}" th:text="${errorMessage}"></p>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">社員コード</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{staffid}" placeholder="例: le999">
          <p class="text-danger" th:if="${#fields.hasErrors('staffid')}" th:errors="*{staffid}"></p>
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">名前</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{name}" placeholder="例: 山田太郎">
          <p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">部署</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{division}" placeholder="例: SC事業部">
          <p class="text-danger" th:if="${#fields.hasErrors('division')}" th:errors="*{division}"></p>
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">セイ</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{sei}" placeholder="例: ヤマダ">
          <p class="text-danger" th:if="${#fields.hasErrors('sei')}" th:errors="*{sei}"></p>
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">メイ</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{mei}" placeholder="例: タロウ">
          <p class="text-danger" th:if="${#fields.hasErrors('mei')}" th:errors="*{mei}"></p>
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">役職</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" th:field="*{position}">
        </div>
      </div>

      <div class="row mb-3 align-items-center">
        <label class="col-sm-2 col-form-label fw-bold">年齢</label>
        <div class="col-sm-10">
          <input type="number" class="form-control" th:field="*{age}" placeholder="例: 30">
          <p class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
        </div>
      </div>

      <div class="button-area">
        <button type="submit" class="btn btn-success me-2">登録</button>
        <a th:href="@{/}" class="btn btn-secondary">戻る</a>
      </div>

    </form>
  </div>
</section>
</body>
</html>

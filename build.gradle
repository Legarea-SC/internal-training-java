plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.2'
}

def resolveWindowsShortPath(File dir) {
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
        return dir.absolutePath
    }

    def output = new ByteArrayOutputStream()
    exec {
        commandLine 'cmd', '/c', "for %I in (\"${dir.absolutePath}\") do @echo %~sI"
        standardOutput = output
    }

    def shortPath = output.toString('MS932').trim()
    return shortPath ? shortPath : dir.absolutePath
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    implementation group: 'org.webjars', name: 'bootstrap', version: '5.2.3'
    implementation group: 'org.webjars', name: 'webjars-locator-core', version: '0.52'
    implementation group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '3.2.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()

    def projectPath = projectDir.absolutePath
    def shortProjectPath = resolveWindowsShortPath(projectDir)

    classpath = files(classpath.files.collect { file ->
        def path = file.absolutePath
        path.startsWith(projectPath)
                ? new File(shortProjectPath + path.substring(projectPath.length()))
                : file
    })
}

tasks.named('bootRun') {
    sourceResources sourceSets.main
}
